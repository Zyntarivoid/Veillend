[package]
name = "veillend-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# `hazmat-address` is used by permit.rs to derive the Address that
# corresponds to a permit's Ed25519 public key (Address::from_payload).
soroban-sdk = { version = "=23.5.3", features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { version = "=23.5.3", features = ["testutils"] }
# Only used by the integration tests to compare event `Val`s (soroban-sdk
# does not re-export the `Compare` trait and `Val` lacks `PartialEq`).
soroban-env-common = "=23.0.1"
# Only used by the integration tests to sign `Permit`s with a deterministic
# Ed25519 keypair (no RNG needed: `SigningKey::from_bytes` takes a fixed seed).
ed25519-dalek = "=2.2.0"