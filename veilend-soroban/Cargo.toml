[package]
name = "veillend-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=23.5.3"

[dev-dependencies]
soroban-sdk = { version = "=23.5.3", features = ["testutils"] }
# Only used by the integration tests to compare event `Val`s (soroban-sdk
# does not re-export the `Compare` trait and `Val` lacks `PartialEq`).
soroban-env-common = "=23.0.1"